name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        # Functions use npm: specifiers from Deno's cache; ignore the repo's pnpm package.json.
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: |
          set -o pipefail
          deno check backend/supabase/functions/*/index.ts 2>&1 | tee check.log
      - name: Report check log
        if: always()
        run: |
          [ -f check.log ] || exit 0
          msg=$(tail -n 60 check.log | awk '{ gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0 }')
          echo "::notice title=deno-check.log::$msg"

  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash  # explicit shell enables -o pipefail, so tee no longer masks failures
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Ensure psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: CI-only dummy SMS provider (approved 2026-11-21)
        # CLI v3.2.0 disables phone login unless an SMS provider block is enabled. Turn on the
        # Twilio block with fake values in the runner's copy only (never committed, never pushed to
        # hosted). The send_sms hook refuses every SMS, and the e2e test sends none.
        run: |
          python3 - <<'EOF'
          p = "supabase/config.toml"
          s = open(p).read()
          old = '[auth.sms.twilio]\nenabled = false\naccount_sid = ""\nmessage_service_sid = ""\n'
          new = '[auth.sms.twilio]\nenabled = true\naccount_sid = "ci-dummy"\nmessage_service_sid = "ci-dummy"\n'
          assert old in s, "twilio block not found"
          open(p, "w").write(s.replace(old, new, 1))
          EOF
          echo "SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN=ci-dummy-not-a-secret" >> "$GITHUB_ENV"

      - name: Start local Supabase
        # PostgREST exposes the api schema, which db:apply creates after start; it retries until then.
        run: mkdir -p /tmp/ci && supabase start --ignore-health-check 2>&1 | tee /tmp/ci/start.log

      - name: Export local connection env
        run: |
          supabase status -o env | grep -E '^[A-Z_]+=' | sed 's/"//g' > /tmp/ci/status.env
          echo "status vars: $(cut -d= -f1 /tmp/ci/status.env | paste -sd ' ')" | tee /tmp/ci/status.log
          grep -q '^DB_URL=.' /tmp/ci/status.env || { echo "DB_URL missing from supabase status" | tee -a /tmp/ci/status.log; exit 1; }
          cat /tmp/ci/status.env >> "$GITHUB_ENV"

      - name: Apply schema (database/schema)
        run: |
          npm run db:apply 2>&1 | tee /tmp/ci/apply.log
          psql "$DB_URL" -X -q -c "notify pgrst, 'reload schema'"

      - name: Seed reference data
        run: npm run db:seed 2>&1 | tee /tmp/ci/seed.log

      - name: pgTAP tests (database/tests)
        run: npm run db:test 2>&1 | tee /tmp/ci/test.log

      - name: Auth config diagnostics (informational)
        continue-on-error: true
        run: bash tests/auth_diag.sh 2>&1 | tee /tmp/ci/authdiag.log

      - name: Auth end-to-end (backend/tests)
        run: bash tests/auth_phone_release.sh 2>&1 | tee /tmp/ci/e2e.log

      - name: Edge Function HTTP tests (backend/tests)
        run: bash tests/edge_functions.sh 2>&1 | tee /tmp/ci/fn.log

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Concurrency suite (backend/tests/concurrency)
        run: deno run --node-modules-dir=auto --allow-net --allow-env --allow-read --allow-sys tests/concurrency/redeem_concurrency.ts 2>&1 | tee /tmp/ci/conc.log

      - name: Edge runtime logs (on failure)
        if: failure()
        run: docker logs "$(docker ps --format '{{.Names}}' | grep -m1 edge_runtime)" 2>&1 | tail -80 | tee /tmp/ci/edgelogs.log

      - name: Probe declarative schema wiring (M0, informational)
        continue-on-error: true
        run: timeout 300 supabase db schema declarative sync < /dev/null 2>&1 | tee /tmp/ci/probe.log

      - name: Codegen
        run: npm run codegen 2>&1 | tee /tmp/ci/codegen.log

      - name: Upload generated contracts
        uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: backend/contracts/

      # git diff ignores untracked files, so this passes until contracts are first committed.
      - name: Codegen drift check
        run: npm run codegen:check 2>&1 | tee /tmp/ci/drift.log

      # Job logs need a GitHub sign-in; annotations are public, so surface step output there.
      - name: Report logs as annotations
        if: always()
        run: |
          for f in /tmp/ci/*.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | awk '{ gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0 }')
            echo "::notice title=$(basename "$f")::$msg"
          done
